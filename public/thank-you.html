<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <title>Hvala! — PropIQ</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preload" href="/assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/playfair-display-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-sans);
      background: var(--page-bg);
      color: var(--ink-900);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 28px 48px;
      border-bottom: 1px solid var(--ink-200);
    }

    @media (max-width: 600px) { header { padding: 22px 24px; } }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--ink-900);
    }

    .logo img { display: block; height: 26px; width: auto; }
    .logo-text {
      font-size: 1.15rem;
      font-weight: 500;
      letter-spacing: -0.3px;
    }

    .logo-text span { opacity: 0.45; }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
    }

    .card {
      text-align: center;
      max-width: 480px;
      width: 100%;
      animation: fadeUp 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .check-wrap {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--white);
      border: var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 36px;
    }

    .check-wrap svg {
      width: 36px;
      height: 36px;
      color: var(--ink-700);
      stroke-dasharray: 60;
      stroke-dashoffset: 60;
      animation: drawCheck 0.5s ease 0.4s forwards;
    }

    @keyframes drawCheck {
      to { stroke-dashoffset: 0; }
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(3rem, 8vw, 5rem);
      font-weight: 500;
      letter-spacing: -3px;
      line-height: 1;
      margin-bottom: 20px;
    }

    .subtitle {
      font-size: 1rem;
      color: var(--ink-500);
      line-height: 1.7;
      margin-bottom: 44px;
      max-width: 360px;
      margin-left: auto;
      margin-right: auto;
    }

    .back-btn {
      display: inline-block;
      background: var(--ink-800);
      color: var(--white);
      border: none;
      padding: 18px 48px;
      border-radius: 100px;
      font-size: 0.95rem;
      font-weight: 500;
      font-family: inherit;
      text-decoration: none;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
    }

    .back-btn:hover { opacity: 0.88; transform: translateY(-2px); }

    footer {
      text-align: center;
      padding: 24px;
      font-size: 0.78rem;
      color: var(--ink-500);
      border-top: 1px solid var(--ink-200);
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo" aria-label="PropIQ"><img src="/assets/logo-light.svg" alt="" aria-hidden="true" width="97" height="26"></a>
  </header>

  <main>
    <div class="card">
      <div class="check-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 13l4 4L19 7"/>
        </svg>
      </div>
      <h1>Hvala!</h1>
      <p class="subtitle">Tvoja analiza je u tijeku. Provjeri email za rezultate.</p>
      <a href="index.html" class="back-btn">Povratak na PropIQ</a>
    </div>
  </main>

  <footer>&copy; 2026 PropIQ. Sva prava pridržana.</footer>

</body>
</html>

<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <title>404 — PropIQ</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preload" href="/assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/playfair-display-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/tokens.css">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-sans);
      background: var(--page-bg);
      color: var(--ink-900);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 28px 48px;
      border-bottom: 1px solid var(--ink-200);
      position: relative;
      z-index: 2;
    }

    @media (max-width: 600px) { header { padding: 22px 24px; } }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--ink-900);
    }

    .logo img { display: block; height: 26px; width: auto; }
    .logo-text {
      font-size: 1.15rem;
      font-weight: 500;
      letter-spacing: -0.3px;
    }

    .logo-text span { opacity: 0.45; }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      position: relative;
    }

    .bg-num {
      position: absolute;
      font-size: clamp(180px, 38vw, 420px);
      font-weight: 500;
      letter-spacing: -16px;
      color: rgba(6,20,27,0.04);
      line-height: 1;
      user-select: none;
      pointer-events: none;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      white-space: nowrap;
    }

    .card {
      text-align: center;
      max-width: 440px;
      width: 100%;
      position: relative;
      z-index: 2;
      animation: fadeUp 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .error-label {
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-500);
      margin-bottom: 20px;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      font-weight: 500;
      letter-spacing: -1.5px;
      line-height: 1.05;
      margin-bottom: 16px;
    }

    .subtitle {
      font-size: 0.95rem;
      color: var(--ink-500);
      line-height: 1.7;
      margin-bottom: 44px;
    }

    .back-btn {
      display: inline-block;
      background: var(--ink-800);
      color: var(--white);
      border: none;
      padding: 18px 48px;
      border-radius: 100px;
      font-size: 0.95rem;
      font-weight: 500;
      font-family: inherit;
      text-decoration: none;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
    }

    .back-btn:hover { opacity: 0.88; transform: translateY(-2px); }

    footer {
      text-align: center;
      padding: 24px;
      font-size: 0.78rem;
      color: var(--ink-500);
      border-top: 1px solid var(--ink-200);
      position: relative;
      z-index: 2;
    }
    .error-label { font-family: var(--font-sans); font-weight: 500; letter-spacing: 0.08em; }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo" aria-label="PropIQ"><img src="/assets/logo-light.svg" alt="" aria-hidden="true" width="97" height="26"></a>
  </header>

  <main>
    <div class="bg-num" aria-hidden="true">404</div>
    <div class="card">
      <p class="error-label">Greška 404</p>
      <h1>Stranica nije<br>pronađena</h1>
      <p class="subtitle">Ova stranica ne postoji ili je uklonjena.</p>
      <a href="index.html" class="back-btn">Povratak na PropIQ</a>
    </div>
  </main>

  <footer>&copy; 2026 PropIQ. Sva prava pridržana.</footer>

</body>
</html>

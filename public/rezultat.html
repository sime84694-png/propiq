<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Pristanak + mjerenje: MORA biti prije svih tagova (Consent Mode v2 default "denied") -->
  <script src="assets/js/tracking-config.js"></script>
  <script src="assets/js/consent.js"></script>
  <title>Vaša analiza — PropIQ</title>
  <meta name="robots" content="noindex, nofollow">
  <!-- Playfair Display s vlastitog hostinga (bez zahtjeva prema Googleu prije pristanka; licenca SIL OFL) -->
  <link rel="preload" href="assets/fonts/playfair-display-latin.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face { font-family: 'Playfair Display'; font-style: normal; font-weight: 600 800; font-display: swap;
      src: url(assets/fonts/playfair-display-latin-ext.woff2) format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
    @font-face { font-family: 'Playfair Display'; font-style: normal; font-weight: 600 800; font-display: swap;
      src: url(assets/fonts/playfair-display-latin.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  </style>
  <style>
    :root {
      --bg: #0a0806;
      --cream: #f0ece4;
      --cream-70: rgba(240,236,228,0.7);
      --cream-40: rgba(240,236,228,0.4);
      --cream-15: rgba(240,236,228,0.15);
      --cream-08: rgba(240,236,228,0.08);
      --cream-04: rgba(240,236,228,0.04);
      --gold: #d4af37;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
      --font-serif: 'Playfair Display', Georgia, serif;
    }

    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--cream);
      min-height: 100vh;
      line-height: 1.6;
    }

    .wrap {
      max-width: 780px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ─── Header ─── */
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 40px;
      animation: fadeUp 0.8s var(--ease) both;
    }
    .logo {
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
    }
    .logo span { color: var(--gold); }
    .back-link {
      color: var(--cream-70);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      transition: color 0.35s var(--ease);
    }
    .back-link:hover { color: var(--cream); }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 100px;
      background: rgba(240,236,228,0.06);
      border: 1px solid var(--cream-15);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--cream-70);
      margin-bottom: 18px;
      animation: fadeUp 0.8s var(--ease) both;
      animation-delay: 0.08s;
    }
    .eyebrow-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--gold); box-shadow: 0 0 10px var(--gold);
      animation: dotPulse 2.2s var(--ease) infinite;
    }
    @keyframes dotPulse {
      0%, 100% { opacity: 0.6; box-shadow: 0 0 6px var(--gold); }
      50% { opacity: 1; box-shadow: 0 0 14px var(--gold); }
    }

    h1 {
      font-family: var(--font-serif);
      font-size: 2.15rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 8px;
      animation: fadeUp 0.8s var(--ease) both;
      animation-delay: 0.16s;
    }
    .subtitle {
      color: var(--cream-70);
      font-size: 0.95rem;
      margin-bottom: 36px;
      animation: fadeUp 0.8s var(--ease) both;
      animation-delay: 0.24s;
    }

    /* ─── Loading ─── */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      padding: 80px 0;
      text-align: center;
      animation: fadeUp 0.8s var(--ease) both;
      animation-delay: 0.32s;
    }
    .spinner-wrap { position: relative; width: 56px; height: 56px; }
    .spinner-pulse {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(212,175,55,0.28), transparent 70%);
      animation: pulse 1.8s var(--ease) infinite;
    }
    .spinner {
      position: absolute;
      top: 8px; left: 8px;
      width: 40px; height: 40px;
      border: 3px solid var(--cream-15);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse {
      0%, 100% { transform: scale(0.82); opacity: 0.35; }
      50%      { transform: scale(1.18); opacity: 0.85; }
    }
    .loading p {
      color: var(--cream-70);
      font-size: 0.95rem;
      animation: breathe 2.4s var(--ease) infinite;
    }
    @keyframes breathe { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }

    /* ─── Analiza card ─── */
    .analiza-card {
      position: relative;
      overflow: hidden;
      background: var(--cream-04);
      border: 1px solid var(--cream-08);
      border-radius: 20px;
      padding: 36px 32px;
      --mx: 50%;
      --my: 0%;
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.7s var(--ease), transform 0.7s var(--ease), border-color 0.4s var(--ease);
    }
    .analiza-card.show { opacity: 1; transform: translateY(0); }
    .analiza-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(480px circle at var(--mx) var(--my), rgba(212,175,55,0.07), transparent 60%);
      opacity: 0;
      transition: opacity 0.5s var(--ease);
      pointer-events: none;
    }
    .analiza-card:hover::before { opacity: 1; }
    .analiza-card:hover { border-color: var(--cream-15); }
    .analiza-card h1, .analiza-card h2, .analiza-card h3 {
      color: var(--cream);
      margin: 26px 0 12px;
      line-height: 1.3;
    }
    .analiza-card h1 { font-size: 1.5rem; }
    .analiza-card h2 { font-size: 1.25rem; }
    .analiza-card h3 { font-size: 1.05rem; }
    .analiza-card h1:first-child, .analiza-card h2:first-child, .analiza-card h3:first-child { margin-top: 0; }
    .analiza-card p { margin: 12px 0; color: var(--cream-70); }
    .analiza-card ul, .analiza-card ol { margin: 12px 0 12px 22px; color: var(--cream-70); }
    .analiza-card li { margin: 6px 0; }
    .analiza-card strong { color: var(--cream); font-weight: 700; }
    .analiza-card hr { border: none; border-top: 1px solid var(--cream-08); margin: 24px 0; }
    .analiza-card table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 0.9rem; }
    .analiza-card th, .analiza-card td { border: 1px solid var(--cream-15); padding: 8px 12px; text-align: left; }
    .analiza-card th { background: var(--cream-08); color: var(--cream); }

    /* ─── Greška ─── */
    .error-box {
      background: rgba(220, 80, 60, 0.06);
      border: 1px solid rgba(220, 80, 60, 0.28);
      border-radius: 20px;
      padding: 40px 32px;
      text-align: center;
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.7s var(--ease), transform 0.7s var(--ease), border-color 0.4s var(--ease), background 0.4s var(--ease);
    }
    .error-box.show { opacity: 1; transform: translateY(0); }
    .error-box.upgrade {
      background: rgba(212, 175, 55, 0.05);
      border-color: rgba(212, 175, 55, 0.28);
    }
    .error-icon-wrap {
      position: relative;
      width: 64px; height: 64px;
      margin: 0 auto 22px;
    }
    .error-icon-pulse {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(220,80,60,0.22), transparent 70%);
      animation: pulse 2.4s var(--ease) infinite;
      transition: background 0.4s var(--ease);
    }
    .error-box.upgrade .error-icon-pulse {
      background: radial-gradient(circle, rgba(212,175,55,0.26), transparent 70%);
    }
    .error-icon {
      position: absolute;
      top: 10px; left: 10px;
      width: 44px; height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e0705a;
      background: rgba(220, 80, 60, 0.12);
      transition: color 0.4s var(--ease), background 0.4s var(--ease);
    }
    .error-box.upgrade .error-icon {
      color: var(--gold);
      background: rgba(212, 175, 55, 0.12);
    }
    .error-eyebrow {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #e0705a;
      margin-bottom: 10px;
      transition: color 0.4s var(--ease);
    }
    .error-box.upgrade .error-eyebrow { color: var(--gold); }
    .error-title {
      font-family: var(--font-serif);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--cream);
      margin-bottom: 12px;
    }
    .error-box p {
      color: var(--cream-70);
      margin-bottom: 28px;
      font-size: 0.98rem;
      max-width: 440px;
      margin-left: auto;
      margin-right: auto;
    }
    .error-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-primary {
      background: var(--cream);
      color: var(--bg);
      border: none;
      padding: 14px 32px;
      border-radius: 100px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      text-decoration: none;
      display: inline-block;
      transition: opacity 0.35s var(--ease), transform 0.35s var(--ease), box-shadow 0.35s var(--ease);
    }
    .btn-primary:hover {
      opacity: 0.92;
      transform: translateY(-3px);
      box-shadow: 0 14px 32px rgba(212,175,55,0.16);
    }

    .btn-ghost {
      background: transparent;
      color: var(--cream-70);
      border: 1px solid var(--cream-15);
      padding: 14px 28px;
      border-radius: 100px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      text-decoration: none;
      display: inline-block;
      transition: border-color 0.35s var(--ease), color 0.35s var(--ease), transform 0.35s var(--ease);
    }
    .btn-ghost:hover {
      border-color: var(--cream-40);
      color: var(--cream);
      transform: translateY(-3px);
    }

    /* ═══════════════════════════════════════════════════════════
       UPSELL PLACEHOLDER — prostor za budući Pro plan CTA.
       Za sad prazno; ovdje ide upsell na Pro (usporedba nekretnina,
       PDF izvještaj, povijest analiza, itd.).
       ═══════════════════════════════════════════════════════════ */
    #upsell-pro {
      /* namjerno prazno — popuniti kasnije */
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (max-width: 600px) {
      .wrap { padding: 32px 18px 60px; }
      h1 { font-size: 1.6rem; }
      .analiza-card { padding: 26px 20px; }
      .error-box { padding: 32px 22px; }
    }

    /* ─── Akcije ispod analize (samo kad je analiza učitana) ─── */
    .analiza-actions {
      display: none;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 32px;
    }

    /* Print zaglavlje — skriveno na ekranu, vidljivo samo pri ispisu */
    .print-header { display: none; }

    /* ─── Ispis / Spremi kao PDF ─── */
    @media print {
      @page { margin: 15mm; }
      html, body {
        background: #fff !important;
        color: #000 !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      body { line-height: 1.42; }
      .wrap { max-width: 100% !important; margin: 0 !important; padding: 0 !important; }

      /* navigacija, gumbi, dekoracija, greška, loading — sve van */
      .top, .eyebrow, #greeting, .subtitle, #loading, #error,
      #upsell-pro, .analiza-actions { display: none !important; }

      /* zaglavlje prve stranice (stisnuto da analiza do 500 riječi stane na 1 stranicu) */
      .print-header {
        display: block !important;
        margin: 0 0 12px;
        padding-bottom: 8px;
        border-bottom: 1px solid #000;
      }
      .print-logo { font-weight: 700; font-size: 0.95rem; letter-spacing: -0.02em; color: #000 !important; }
      .print-title { font-family: var(--font-serif); font-size: 1.3rem; color: #000 !important; margin: 4px 0 2px; }
      .print-date { font-size: 0.78rem; color: #444 !important; }

      /* analiza -> čist dokument na bijelom */
      .analiza-card {
        display: block !important;
        opacity: 1 !important;
        transform: none !important;
        background: #fff !important;
        border: none !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        padding: 0 !important;
        overflow: visible !important;
        color: #000 !important;
        font-size: 0.9rem;
      }
      .analiza-card::before { display: none !important; }
      .analiza-card h1, .analiza-card h2, .analiza-card h3 {
        font-family: var(--font-serif);
        color: #000 !important;
        margin: 13px 0 6px;
        page-break-after: avoid;
      }
      .analiza-card h1 { font-size: 1.3rem; }
      .analiza-card h2 { font-size: 1.12rem; }
      .analiza-card h3 { font-size: 1rem; }
      .analiza-card > :first-child { margin-top: 0 !important; }
      .analiza-card p, .analiza-card li, .analiza-card strong { color: #000 !important; }
      .analiza-card p { margin: 6px 0; }
      .analiza-card ul, .analiza-card ol { margin: 6px 0 6px 20px; }
      .analiza-card li { margin: 2px 0; }
      .analiza-card a { color: #000 !important; text-decoration: underline; }
      .analiza-card hr { border-top: 1px solid #bbb !important; }
      .analiza-card table { border-collapse: collapse; }
      .analiza-card th, .analiza-card td { border: 1px solid #999 !important; color: #000 !important; }
      .analiza-card th { background: #eee !important; }

      /* ne lomiti blokove i liste nasred stranice */
      .analiza-card p, .analiza-card ul, .analiza-card ol, .analiza-card li,
      .analiza-card table, .analiza-card tr, .print-header {
        page-break-inside: avoid;
      }

      /* ne ispisivati URL iza linkova */
      .analiza-card a[href]::after { content: ""; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- Zaglavlje samo za ispis (PDF) -->
    <div class="print-header" id="print-header">
      <div class="print-logo">Prop<span>IQ</span></div>
      <h2 class="print-title" id="print-title">Vaša analiza</h2>
      <div class="print-date" id="print-date"></div>
    </div>

    <div class="top">
      <div class="logo">Prop<span>IQ</span></div>
      <a href="index.html" class="back-link">← Natrag na početnu</a>
    </div>

    <div class="eyebrow"><span class="eyebrow-dot"></span>AI analiza nekretnine</div>
    <h1 id="greeting">Vaša analiza</h1>
    <p class="subtitle">Generirano na temelju oglasa koji ste poslali.</p>

    <!-- Loading -->
    <div class="loading" id="loading">
      <div class="spinner-wrap">
        <div class="spinner-pulse"></div>
        <div class="spinner"></div>
      </div>
      <p>Analiziramo nekretninu… ovo traje nekoliko sekundi.</p>
    </div>

    <!-- Rezultat -->
    <div class="analiza-card" id="analiza" style="display:none;"></div>

    <!-- Akcije (prikazuju se samo kad je analiza uspješno učitana) -->
    <div class="analiza-actions" id="analiza-actions">
      <button class="btn-primary" onclick="window.print()">Spremi kao PDF</button>
      <a href="index.html" class="btn-ghost" id="nova-analiza-btn">Nova analiza</a>
    </div>

    <!-- Greška -->
    <div class="error-box" id="error" style="display:none;">
      <div class="error-icon-wrap">
        <div class="error-icon-pulse"></div>
        <div class="error-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
        </div>
      </div>
      <div class="error-eyebrow" id="error-eyebrow">Greška</div>
      <h2 class="error-title" id="error-title">Nešto nije u redu</h2>
      <p id="error-msg">Došlo je do greške pri dohvaćanju analize.</p>
      <div class="error-actions">
        <a href="index.html#cijene" class="btn-primary" id="error-upgrade-btn" style="display:none;">Pogledaj planove</a>
        <button class="btn-ghost" id="error-retry-btn" onclick="location.reload()">Pokušaj ponovo</button>
      </div>
    </div>

    <!-- UPSELL PLACEHOLDER (Pro plan) — za sad prazno, popuniti kasnije -->
    <section id="upsell-pro"></section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js" integrity="sha384-948ahk4ZmxYVYOc+rxN1H2gM1EJ2Duhp7uHtZ4WSLkV4Vtx5MUqnV+l7u9B+jFv+" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.16/dist/purify.min.js" integrity="sha384-a7SzOxErzJ3ZpQz0zJ32d67dSitNzPcbfybc/ykU9KJhMgZkwqfSxlhhdJRS+XGL" crossorigin="anonymous"></script>
  <script>
    marked.use({ breaks: true, gfm: true });

    // Izlaz modela je nepouzdan: Markdown -> HTML uvijek prolazi kroz DOMPurify.
    // Ako se DOMPurify ne učita, ne prikazuje se ništa (nikad sirovi HTML).
    function markdownUHtml(md) {
      if (!window.DOMPurify) return '';
      return DOMPurify.sanitize(marked.parse(md));
    }

    const loadingEl = document.getElementById('loading');
    const analizaEl = document.getElementById('analiza');
    const errorEl = document.getElementById('error');
    const errorMsgEl = document.getElementById('error-msg');
    const errorUpgradeBtn = document.getElementById('error-upgrade-btn');
    const errorEyebrowEl = document.getElementById('error-eyebrow');
    const errorTitleEl = document.getElementById('error-title');

    // Glatko prikazivanje elementa: postavi display, pa na sljedećem
    // frameu dodaj klasu koja pokreće CSS tranziciju (fade + slide up).
    function reveal(el) {
      el.style.display = 'block';
      requestAnimationFrame(() => {
        requestAnimationFrame(() => el.classList.add('show'));
      });
    }
    function hide(el) {
      el.classList.remove('show');
      el.style.display = 'none';
    }

    function showError(msg, isQuota) {
      otkaziDio();
      hide(loadingEl);
      hide(analizaEl);
      document.getElementById('analiza-actions').style.display = 'none';
      if (msg) errorMsgEl.textContent = msg;
      errorEl.classList.toggle('upgrade', !!isQuota);
      errorEyebrowEl.textContent = isQuota ? 'Nadogradnja' : 'Greška';
      errorTitleEl.textContent = isQuota ? 'Iskoristili ste dostupne analize' : 'Nešto nije u redu';
      errorUpgradeBtn.style.display = isQuota ? 'inline-block' : 'none';
      reveal(errorEl);
    }

    // Suptilan "spotlight" koji prati miša preko kartice s analizom —
    // ista ideja kao na glavnoj stranici, samo suzdržanije.
    analizaEl.addEventListener('mousemove', (e) => {
      const rect = analizaEl.getBoundingClientRect();
      analizaEl.style.setProperty('--mx', `${e.clientX - rect.left}px`);
      analizaEl.style.setProperty('--my', `${e.clientY - rect.top}px`);
    });

    // Podaci i gotova analiza ostaju u sessionStorageu (F5 prikazuje isti rezultat)
    // i brišu se tek kad korisnik krene u novu analizu.
    document.getElementById('nova-analiza-btn').addEventListener('click', () => {
      try {
        sessionStorage.removeItem('propiq_analiza_data');
        sessionStorage.removeItem('propiq_analiza_rezultat');
      } catch {}
    });

    // Tekst koji stiže streamom iscrtava se najviše jednom po frameu. Prvi dio teksta
    // skriva loader i otkriva karticu; akcije (PDF / Nova analiza) čekaju kraj analize.
    let dioFrame = 0;
    let dioMarkdown = '';
    function prikaziDio(markdown) {
      dioMarkdown = markdown;
      if (dioFrame) return;
      dioFrame = requestAnimationFrame(() => {
        dioFrame = 0;
        analizaEl.innerHTML = markdownUHtml(dioMarkdown);
        if (analizaEl.style.display === 'none') {
          hide(loadingEl);
          reveal(analizaEl);
        }
      });
    }
    function otkaziDio() {
      cancelAnimationFrame(dioFrame);
      dioFrame = 0;
    }

    const NAPOMENA_SKRACENO =
      '\n\n---\n\n*Napomena: izvještaj je skraćen jer je dosegnuta najveća dopuštena duljina odgovora.*';

    // Čita SSE odgovor funkcije (data: {...}\n\n) i svaki događaj predaje naDogadjaj.
    async function procitajDogadjaje(body, naDogadjaj) {
      const reader = body.pipeThrough(new TextDecoderStream()).getReader();
      let buf = '';
      for (;;) {
        const { value, done } = await reader.read();
        if (done) return;
        buf += value;
        let i;
        while ((i = buf.indexOf('\n\n')) !== -1) {
          const red = buf.slice(0, i);
          buf = buf.slice(i + 2);
          if (red.startsWith('data:')) naDogadjaj(JSON.parse(red.slice(5)));
        }
      }
    }

    function prikaziAnalizu(markdown) {
      otkaziDio();
      analizaEl.innerHTML = markdownUHtml(markdown);
      hide(loadingEl);
      hide(errorEl);
      reveal(analizaEl);

      // Prikaži akcije (Spremi kao PDF / Nova analiza) tek kad analiza postoji
      document.getElementById('analiza-actions').style.display = 'flex';
      // Pripremi print zaglavlje: naslov analize + trenutni datum (hrvatski format)
      document.getElementById('print-title').textContent = document.getElementById('greeting').textContent;
      document.getElementById('print-date').textContent =
        new Date().toLocaleDateString('hr-HR', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    function procitajSpremljeniRezultat(requestId) {
      if (!requestId) return null;
      try {
        const spremljeno = JSON.parse(sessionStorage.getItem('propiq_analiza_rezultat') || 'null');
        return spremljeno && spremljeno.request_id === requestId && spremljeno.analiza ? spremljeno.analiza : null;
      } catch {
        return null;
      }
    }

    async function loadAnaliza() {
      let raw;
      try {
        raw = sessionStorage.getItem('propiq_analiza_data');
      } catch {
        raw = null;
      }

      if (!raw) {
        showError('Nema podataka za analizu. Vratite se na početnu i ispunite formu.');
        return;
      }

      let data;
      try {
        data = JSON.parse(raw);
      } catch {
        showError('Podaci za analizu su neispravni. Pokušajte ponovo s početne stranice.');
        return;
      }

      // Personalizirani pozdrav ako imamo ime
      if (data.ime) {
        const first = String(data.ime).trim().split(/\s+/)[0];
        if (first) document.getElementById('greeting').textContent = `Analiza za ${first}`;
      }

      // F5 nakon gotove analize: prikaži spremljeni rezultat bez novog poziva funkcije
      // (i bez ponovnog mjerenja konverzije).
      const spremljenaAnaliza = procitajSpremljeniRezultat(data.request_id);
      if (spremljenaAnaliza) {
        prikaziAnalizu(spremljenaAnaliza);
        return;
      }

      try {
        const res = await fetch('/.netlify/functions/analiza', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });

        // Greške prije početka analize (limit, podaci, nedostupno) stižu kao JSON { error }.
        if (!res.ok || !(res.headers.get('Content-Type') || '').includes('text/event-stream')) {
          const payload = await res.json().catch(() => ({}));
          showError(payload.error || 'Analiza trenutno nije dostupna. Pokušajte ponovo.', res.status === 403);
          return;
        }

        // Analiza stiže streamom: tekst se prikazuje kako stiže, a tek događaj "kraj"
        // znači da je uspjela (i da je izbrojana u limit).
        let analiza = '';
        let kraj = null;
        let greska = null;
        try {
          await procitajDogadjaje(res.body, (d) => {
            if (typeof d.tekst === 'string') {
              analiza += d.tekst;
              prikaziDio(analiza);
            } else if (d.kraj) {
              kraj = d;
            } else if (d.greska) {
              greska = d.greska;
            }
          });
        } catch {
          kraj = null;
        }

        if (greska || !kraj) {
          showError(greska || 'Veza je prekinuta prije kraja analize. Pokušajte ponovo — ova analiza vam se ne broji u limit.');
          return;
        }

        if (kraj.skraceno) analiza += NAPOMENA_SKRACENO;

        prikaziAnalizu(analiza);

        // Spremi gotov rezultat da F5 prikaže istu analizu bez novog poziva.
        if (data.request_id) {
          try {
            sessionStorage.setItem('propiq_analiza_rezultat',
              JSON.stringify({ request_id: data.request_id, analiza }));
          } catch {}
        }

        // Glavna konverzija. Broji se jednom: refresh prikazuje spremljeni rezultat
        // i ovdje ne dolazi.
        try {
          window.propiqTrack && window.propiqTrack('analysis_success', {
            plan: data.plan || 'free',
            event_id: 'an_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
          });
        } catch {}
      } catch {
        showError('Došlo je do greške pri dohvaćanju analize. Provjerite vezu i pokušajte ponovo.');
      }
    }

    loadAnaliza();
  </script>

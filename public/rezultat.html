      src: url(assets/fonts/playfair-display-latin-ext.woff2) format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
    @font-face { font-family: 'Playfair Display'; font-style: normal; font-weight: 600 800; font-display: swap;
      src: url(assets/fonts/playfair-display-latin.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

  <style>
    :root {
      --bg: #0a0806;
      --cream: #f0ece4;
      --cream-70: rgba(240,236,228,0.7);
      --cream-40: rgba(240,236,228,0.4);
      --cream-15: rgba(240,236,228,0.15);
      --cream-08: rgba(240,236,228,0.08);
      --cream-04: rgba(240,236,228,0.04);
      --gold: #d4af37;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
      --font-serif: 'Playfair Display', Georgia, serif;
    }

    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-variant-numeric: tabular-nums;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--cream);
      min-height: 100vh;
      line-height: 1.6;
    }

    .wrap {
      max-width: 780px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ─── Header ─── */
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 40px;
      animation: fadeUp 0.8s var(--ease) both;
    }
    .logo {
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
    }
    .logo span { color: var(--gold); }
    .back-link {
      color: var(--cream-70);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      transition: color 0.35s var(--ease);
    }
    .back-link:hover { color: var(--cream); }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 100px;
      background: rgba(240,236,228,0.06);
      border: 1px solid var(--cream-15);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--cream-70);
      margin-bottom: 18px;
      animation: fadeUp 0.8s var(--ease) both;
      animation-delay: 0.08s;
    }
    .eyebrow-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--gold); box-shadow: 0 0 10px var(--gold);
      animation: dotPulse 2.2s var(--ease) infinite;
    }
    @keyframes dotPulse {
      0%, 100% { opacity: 0.6; box-shadow: 0 0 6px var(--gold); }
      50% { opacity: 1; box-shadow: 0 0 14px var(--gold); }
    }

    h1 {
      font-family: var(--font-serif);
      font-size: 2.15rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 8px;
      animation: fadeUp 0.8s var(--ease) both;
      animation-delay: 0.16s;
    }
    .subtitle {
      color: var(--cream-70);
      font-size: 0.95rem;
      margin-bottom: 36px;
      animation: fadeUp 0.8s var(--ease) both;
      animation-delay: 0.24s;
    }

    /* ─── Loading ─── */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      padding: 80px 0;
      text-align: center;
      animation: fadeUp 0.8s var(--ease) both;
      animation-delay: 0.32s;
    }
    .spinner-wrap { position: relative; width: 56px; height: 56px; }
    .spinner-pulse {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(212,175,55,0.28), transparent 70%);
      animation: pulse 1.8s var(--ease) infinite;
    }
    .spinner {
      position: absolute;
      top: 8px; left: 8px;
      width: 40px; height: 40px;
      border: 3px solid var(--cream-15);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse {
      0%, 100% { transform: scale(0.82); opacity: 0.35; }
      50%      { transform: scale(1.18); opacity: 0.85; }
    }
    .loading p {
      color: var(--cream-70);
      font-size: 0.95rem;
      animation: breathe 2.4s var(--ease) infinite;
    }
    @keyframes breathe { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }

    /* ─── Izvještaj: kartice ─── */
    .izvjestaj { display: none; }
    .kartica {
      position: relative;
      background: var(--cream-04);
      border: 1px solid var(--cream-08);
      border-radius: 20px;
      padding: 30px 32px;
      margin-bottom: 16px;
      animation: fadeUp 0.8s var(--ease) both;
      animation-delay: calc(var(--i, 0) * 0.09s);
      transition: border-color 0.4s var(--ease);
    }
    .kartica:hover { border-color: var(--cream-15); }
    .kartica h2 {
      font-family: var(--font-serif);
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 16px;
      line-height: 1.3;
    }
    .kartica h3 {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--cream-40);
      margin: 22px 0 10px;
    }
    .kartica p { color: var(--cream-70); margin: 8px 0; }
    .kartica ul { list-style: none; }
    .kartica li {
      position: relative;
      padding-left: 18px;
      margin: 8px 0;
      color: var(--cream-70);
    }
    .kartica li::before {
      content: '';
      position: absolute;
      left: 2px; top: 0.65em;
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--gold);
    }
    /* null vrijednosti: manji, prigušeni font (ne kao prave brojke) */
    .nd, .metrika-vrijednost.nd, .raspon.nd, .ponuda.nd, .lokacija.nd {
      color: var(--cream-40);
      font-family: inherit;
      font-style: normal;
      font-weight: 400;
      font-size: 0.82rem;
      line-height: 1.4;
    }
    .napomena { font-size: 0.78rem; color: var(--cream-40); margin-top: 14px; }

    /* a) zaglavlje */
    .kartica.zaglavlje h2 { font-size: 1.65rem; margin-bottom: 6px; }
    .lokacija { color: var(--cream-70); font-size: 0.95rem; margin-bottom: 22px; }
    .metrike {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .metrika {
      background: var(--cream-04);
      border: 1px solid var(--cream-08);
      border-radius: 14px;
      padding: 14px 16px;
    }
    .metrika-label {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--cream-40);
      margin-bottom: 4px;
    }
    .metrika-vrijednost {
      font-family: var(--font-serif);
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.25;
    }
    .metrika-vrijednost.mala { font-size: 1.05rem; }

    /* b) preporuka */
    .preporuka-red { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
    .znacka {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      border-radius: 100px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border: 1px solid;
    }
    .znacka::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .znacka.povoljno   { color: #6fcf97; background: rgba(111,207,151,0.08); border-color: rgba(111,207,151,0.32); }
    .znacka.pregovaraj { color: var(--gold); background: rgba(212,175,55,0.08); border-color: rgba(212,175,55,0.32); }
    .znacka.oprez      { color: #e0705a; background: rgba(220,80,60,0.08); border-color: rgba(220,80,60,0.32); }
    .znacka.nedovoljno { color: var(--cream-40); background: var(--cream-04); border-color: var(--cream-15); }
    .nedovoljno-tekst { color: var(--cream-70); font-size: 0.92rem; margin-bottom: 14px; }
    .cijena-unos { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--cream-08); }
    .cijena-unos label { display: block; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.06em; color: var(--cream-40); margin-bottom: 8px; }
    .cijena-unos-red { display: flex; gap: 10px; flex-wrap: wrap; }
    .cijena-unos input {
      flex: 1 1 160px; min-width: 0; padding: 10px 14px; border-radius: 10px;
      border: 1px solid var(--cream-15); background: var(--cream-04); color: var(--cream); font: inherit;
    }
    .cijena-unos button {
      padding: 10px 20px; border-radius: 10px; border: 1px solid rgba(212,175,55,0.5);
      background: rgba(212,175,55,0.12); color: var(--gold); font: inherit; font-weight: 700; cursor: pointer;
    }
    .cijena-greska { color: #e0705a; font-size: 0.85rem; margin-top: 8px; }
    .upisali { display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: 100px; border: 1px solid var(--cream-15); color: var(--cream-40); font-family: inherit; font-size: 0.66rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; vertical-align: middle; white-space: nowrap; }
    .upisali-popis { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 16px; font-size: 0.88rem; color: var(--cream-70); }
    .rucno-napomena { color: var(--cream-40); font-size: 0.78rem; margin-top: 10px; }
    .referenca-napomena { color: var(--cream-40); font-size: 0.78rem; margin-top: 10px; }
    .ocjena { font-family: var(--font-serif); font-size: 2.4rem; font-weight: 700; line-height: 1; }
    .ocjena small { font-size: 1rem; color: var(--cream-40); font-weight: 600; }
    .sazetak { color: var(--cream); font-size: 1.02rem; }

    /* c) fer vrijednost */
    .raspon { font-family: var(--font-serif); font-size: 1.7rem; font-weight: 700; margin-bottom: 4px; }
    .raspon-po-m2 { color: var(--cream-40); font-size: 0.88rem; margin-bottom: 18px; }
    .traka { position: relative; height: 10px; border-radius: 100px; background: var(--cream-08); margin: 30px 0 34px; }
    .traka-fer {
      position: absolute; top: 0; bottom: 0;
      border-radius: 100px;
      background: linear-gradient(90deg, rgba(212,175,55,0.35), rgba(212,175,55,0.7));
    }
    .traka-cijena {
      position: absolute; top: -7px;
      width: 4px; height: 24px;
      margin-left: -2px;
      border-radius: 2px;
      background: var(--cream);
      box-shadow: 0 0 12px rgba(240,236,228,0.45);
    }
    .traka-oznaka {
      position: absolute; top: -26px;
      transform: translateX(-50%);
      white-space: nowrap;
      font-size: 0.72rem; font-weight: 700; color: var(--cream);
    }
    .traka-krajevi { position: absolute; left: 0; right: 0; top: 18px; display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--cream-40); }
    .polozaj { font-size: 0.92rem; margin-bottom: 14px; color: var(--cream); }
    .chip {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 100px;
      border: 1px solid var(--cream-15);
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--cream-70);
      margin-bottom: 10px;
    }
    .chip.niska { color: #e0705a; border-color: rgba(220,80,60,0.32); }
    .chip.srednja { color: var(--gold); border-color: rgba(212,175,55,0.32); }
    .chip.visoka { color: #6fcf97; border-color: rgba(111,207,151,0.32); }

    /* d) prinos */
    .metrike.cetiri { grid-template-columns: repeat(2, 1fr); }
    .napomene { margin-top: 14px; }
    .napomene li { font-size: 0.78rem; color: var(--cream-40); margin: 4px 0; }
    .napomene li::before { background: var(--cream-40); }

    /* e) rizici */
    .rizik { padding: 14px 0; border-top: 1px solid var(--cream-08); }
    .rizik:first-of-type { border-top: none; padding-top: 0; }
    .rizik-glava { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
    .rizik-naslov { font-weight: 700; color: var(--cream); }
    .rizik p { margin: 0; font-size: 0.93rem; }
    .razina {
      flex: none;
      padding: 3px 10px;
      border-radius: 100px;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border: 1px solid;
    }
    .razina.nizak   { color: #6fcf97; border-color: rgba(111,207,151,0.32); }
    .razina.srednji { color: var(--gold); border-color: rgba(212,175,55,0.32); }
    .razina.visok   { color: #e0705a; border-color: rgba(220,80,60,0.32); }
    .porez { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--cream-08); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--cream-70); font-size: 0.93rem; }
    .porez strong { color: var(--cream); }

    /* f) pregovaranje */
    .ponuda-red { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 4px; }
    .ponuda { font-family: var(--font-serif); font-size: 1.7rem; font-weight: 700; }
    .usteda { color: #6fcf97; font-weight: 700; font-size: 0.92rem; }

    /* h) footer */
    .footer-napomena { text-align: center; font-size: 0.8rem; color: var(--cream-40); margin: 28px 0 0; }

    /* ─── Greška ─── */
    .error-box {
      background: rgba(220, 80, 60, 0.06);
      border: 1px solid rgba(220, 80, 60, 0.28);
      border-radius: 20px;
      padding: 40px 32px;
      text-align: center;
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.7s var(--ease), transform 0.7s var(--ease), border-color 0.4s var(--ease), background 0.4s var(--ease);
    }
    .error-box.show { opacity: 1; transform: translateY(0); }
    .error-box.upgrade {
      background: rgba(212, 175, 55, 0.05);
      border-color: rgba(212, 175, 55, 0.28);
    }
    .error-icon-wrap {
      position: relative;
      width: 64px; height: 64px;
      margin: 0 auto 22px;
    }
    .error-icon-pulse {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(220,80,60,0.22), transparent 70%);
      animation: pulse 2.4s var(--ease) infinite;
      transition: background 0.4s var(--ease);
    }
    .error-box.upgrade .error-icon-pulse {
      background: radial-gradient(circle, rgba(212,175,55,0.26), transparent 70%);
    }
    .error-icon {
      position: absolute;
      top: 10px; left: 10px;
      width: 44px; height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e0705a;
      background: rgba(220, 80, 60, 0.12);
      transition: color 0.4s var(--ease), background 0.4s var(--ease);
    }
    .error-box.upgrade .error-icon {
      color: var(--gold);
      background: rgba(212, 175, 55, 0.12);
    }
    .error-eyebrow {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #e0705a;
      margin-bottom: 10px;
      transition: color 0.4s var(--ease);
    }
    .error-box.upgrade .error-eyebrow { color: var(--gold); }
    .error-title {
      font-family: var(--font-serif);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--cream);
      margin-bottom: 12px;
    }
    .error-box p {
      color: var(--cream-70);
      margin-bottom: 28px;
      font-size: 0.98rem;
      max-width: 440px;
      margin-left: auto;
      margin-right: auto;
    }
    .error-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-primary {
      background: var(--cream);
      color: var(--bg);
      border: none;
      padding: 14px 32px;
      border-radius: 100px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      text-decoration: none;
      display: inline-block;
      transition: opacity 0.35s var(--ease), transform 0.35s var(--ease), box-shadow 0.35s var(--ease);
    }
    .btn-primary:hover {
      opacity: 0.92;
      transform: translateY(-3px);
      box-shadow: 0 14px 32px rgba(212,175,55,0.16);
    }

    .btn-ghost {
      background: transparent;
      color: var(--cream-70);
      border: 1px solid var(--cream-15);
      padding: 14px 28px;
      border-radius: 100px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      text-decoration: none;
      display: inline-block;
      transition: border-color 0.35s var(--ease), color 0.35s var(--ease), transform 0.35s var(--ease);
    }
    .btn-ghost:hover {
      border-color: var(--cream-40);
      color: var(--cream);
      transform: translateY(-3px);
    }

    /* ═══════════════════════════════════════════════════════════
       UPSELL PLACEHOLDER — prostor za budući Pro plan CTA.
       Za sad prazno; ovdje ide upsell na Pro (usporedba nekretnina,
       PDF izvještaj, povijest analiza, itd.).
       ═══════════════════════════════════════════════════════════ */
    #upsell-pro {
      /* namjerno prazno — popuniti kasnije */
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (max-width: 600px) {
      .wrap { padding: 32px 18px 60px; }
      h1 { font-size: 1.6rem; }
      .kartica { padding: 24px 20px; }
      .metrike { grid-template-columns: 1fr 1fr; }
      .kartica.zaglavlje h2 { font-size: 1.35rem; }
      .error-box { padding: 32px 22px; }
    }

    /* ─── Akcije ispod analize (samo kad je analiza učitana) ─── */
    .analiza-actions {
      display: none;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 32px;
    }

    /* Print zaglavlje — skriveno na ekranu, vidljivo samo pri ispisu */
    .print-header { display: none; }

    /* ─── Ispis / Spremi kao PDF ─── */
    @media print {
      @page { margin: 15mm; }
      html, body {
        background: #fff !important;
        color: #000 !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      body { line-height: 1.42; }
      .wrap { max-width: 100% !important; margin: 0 !important; padding: 0 !important; }

      /* navigacija, gumbi, dekoracija, greška, loading — sve van */
      .top, .eyebrow, #greeting, .subtitle, #loading, #error,
      #upsell-pro, .analiza-actions { display: none !important; }

      /* zaglavlje prve stranice */
      .print-header {
        display: block !important;
        margin: 0 0 12px;
        padding-bottom: 8px;
        border-bottom: 1px solid #000;
      }
      .print-logo { font-weight: 700; font-size: 0.95rem; letter-spacing: -0.02em; color: #000 !important; }
      .print-title { font-family: var(--font-serif); font-size: 1.3rem; color: #000 !important; margin: 4px 0 2px; }
      .print-date { font-size: 0.78rem; color: #444 !important; }

      /* kartice -> čist dokument na bijelom */
      .izvjestaj { display: block !important; }
      .kartica {
        animation: none !important;
        background: #fff !important;
        border: 1px solid #bbb !important;
        border-radius: 8px !important;
        padding: 12px 14px !important;
        margin-bottom: 10px !important;
        color: #000 !important;
        font-size: 0.88rem;
        page-break-inside: avoid;
      }
      .kartica h2, .kartica p, .kartica li, .kartica strong, .metrika-vrijednost, .raspon, .ocjena,
      .ponuda, .sazetak, .rizik-naslov, .polozaj, .porez, .porez strong { color: #000 !important; }
      .kartica h3, .metrika-label, .raspon-po-m2, .referenca-napomena, .napomene li, .napomena, .nd, .traka-krajevi,
      .footer-napomena, .ocjena small { color: #444 !important; }
      .kartica h2 { font-size: 1.05rem; margin-bottom: 8px; }
      .kartica.zaglavlje h2 { font-size: 1.3rem; }
      .metrika { background: #fff !important; border: 1px solid #ccc !important; }
      .znacka, .chip, .razina { color: #000 !important; border-color: #000 !important; background: #fff !important; }
      .traka { background: #ddd !important; }
      .traka-fer { background: #999 !important; }
      .traka-cijena { background: #000 !important; box-shadow: none !important; }
      .traka-oznaka { color: #000 !important; }
      .usteda { color: #000 !important; }
      .cijena-unos { display: none !important; }
      .kartica li::before { background: #000 !important; }
      .rizik { page-break-inside: avoid; border-top-color: #ccc !important; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- Zaglavlje samo za ispis (PDF) -->
    <div class="print-header" id="print-header">
      <div class="print-logo">Prop<span>IQ</span></div>
      <h2 class="print-title" id="print-title">Tvoja analiza</h2>
      <div class="print-date" id="print-date"></div>
    </div>

    <div class="top">
      <div class="logo">Prop<span>IQ</span></div>
      <a href="index.html" class="back-link">← Natrag na početnu</a>
    </div>

    <div class="eyebrow"><span class="eyebrow-dot"></span>AI analiza nekretnine</div>
    <h1 id="greeting">Tvoja analiza</h1>
    <p class="subtitle">Generirano na temelju oglasa koji je poslan.</p>

    <!-- Loading -->
    <div class="loading" id="loading">
      <div class="spinner-wrap">
        <div class="spinner-pulse"></div>
        <div class="spinner"></div>
      </div>
      <p id="loading-tekst" aria-live="polite">Procjenjujem fer vrijednost…</p>
    </div>

    <!-- Rezultat -->
    <div class="izvjestaj" id="analiza"></div>

    <!-- Akcije (prikazuju se samo kad je analiza uspješno učitana) -->
    <div class="analiza-actions" id="analiza-actions">
      <button class="btn-primary" onclick="window.print()">Spremi kao PDF</button>
      <a href="index.html" class="btn-ghost" id="nova-analiza-btn">Nova analiza</a>
    </div>

    <!-- Greška -->
    <div class="error-box" id="error" style="display:none;">
      <div class="error-icon-wrap">
        <div class="error-icon-pulse"></div>
        <div class="error-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
        </div>
      </div>
      <div class="error-eyebrow" id="error-eyebrow">Greška</div>
      <h2 class="error-title" id="error-title">Nešto nije u redu</h2>
      <p id="error-msg">Došlo je do greške pri dohvaćanju analize.</p>
      <div class="error-actions">
        <a href="index.html#cijene" class="btn-primary" id="error-upgrade-btn" style="display:none;">Pogledaj planove</a>
        <button class="btn-ghost" id="error-retry-btn" onclick="location.reload()">Pokušaj ponovo</button>
      </div>
    </div>

    <!-- UPSELL PLACEHOLDER (Pro plan) — za sad prazno, popuniti kasnije -->
    <section id="upsell-pro"></section>
  </div>

  <script>
    const loadingEl = document.getElementById('loading');
    // Stvarne faze: server javlja koji je poziv u tijeku (bez postotaka, trajanje nije predvidivo).
    // Faze prate zahtjeve: A (procjena) pa B (analiza).
    const FAZE = { procjena: 'Procjenjujem fer vrijednost…', analiza: 'Analiziram rizike i pregovore…' };
    const loadingTekstEl = document.getElementById('loading-tekst');
    const analizaEl = document.getElementById('analiza');
    const errorEl = document.getElementById('error');
    const errorMsgEl = document.getElementById('error-msg');
    const errorUpgradeBtn = document.getElementById('error-upgrade-btn');
    const errorEyebrowEl = document.getElementById('error-eyebrow');
    const errorTitleEl = document.getElementById('error-title');

    // Glatko prikazivanje elementa: postavi display, pa na sljedećem
    // frameu dodaj klasu koja pokreće CSS tranziciju (fade + slide up).
    function reveal(el) {
      el.style.display = 'block';
      requestAnimationFrame(() => {
        requestAnimationFrame(() => el.classList.add('show'));
      });
    }
    function hide(el) {
      el.classList.remove('show');
      el.style.display = 'none';
    }

    function showError(msg, isQuota) {
      hide(loadingEl);
      hide(analizaEl);
      document.getElementById('analiza-actions').style.display = 'none';
      if (msg) errorMsgEl.textContent = msg;
      errorEl.classList.toggle('upgrade', !!isQuota);
      errorEyebrowEl.textContent = isQuota ? 'Nadogradnja' : 'Greška';
      errorTitleEl.textContent = isQuota ? 'Dostupne analize su iskorištene' : 'Nešto nije u redu';
      errorUpgradeBtn.style.display = isQuota ? 'inline-block' : 'none';
      reveal(errorEl);
    }

    // Podaci i gotova analiza ostaju u sessionStorageu (F5 prikazuje isti rezultat)
    // i brišu se tek kad korisnik krene u novu analizu.
    document.getElementById('nova-analiza-btn').addEventListener('click', () => {
      try {
        sessionStorage.removeItem('propiq_analiza_data');
        sessionStorage.removeItem('propiq_analiza_rezultat');
      } catch {}
    });

    // Jedan korak analize (zahtjev A ili B): običan JSON. Ako veza pukne, odgovor nije JSON ili je status 5xx,
    // korak se automatski ponavlja JEDNOM (isti zahtjev, isti procjena_id); 4xx (limit, podaci, istekla
    // procjena) se ne ponavlja. Vraća { ok, status, payload }.
    const PONOVNO_TEKST = 'Veza je zapela, pokušavam ponovo…';
    async function izvrsiKorak(tijelo) {
      let ishod = { ok: false, status: 0, payload: {} };
      for (let pokusaj = 1; pokusaj <= 2; pokusaj++) {
        let ponovljivo = true;
        try {
          const res = await fetch('/.netlify/functions/analiza', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(tijelo),
          });
          const payload = await res.json().catch(() => null);
          ishod = { ok: res.ok && !!payload, status: res.status, payload: payload || {} };
          ponovljivo = res.status >= 500 || (res.ok && !payload);
        } catch {
          ishod = { ok: false, status: 0, payload: {} };
        }
        if (ishod.ok || !ponovljivo) return ishod;
        if (pokusaj === 1) loadingTekstEl.textContent = PONOVNO_TEKST;
      }
      return ishod;
    }

    // ─── Prikaz izvještaja ───
    // Sve što je došlo od modela ubacuje se isključivo kao tekst (textContent), nikad kao HTML,
    // pa nepouzdan tekst ne može umetnuti HTML ni skriptu.
    const ND = 'nije navedeno u oglasu';
    const NIJE_MOGUCE = 'nije moguće izračunati';
    const NEMA_PROCJENE = 'nema procjene';
    const NF = new Intl.NumberFormat('hr-HR', { maximumFractionDigits: 0 });
    const NF1 = new Intl.NumberFormat('hr-HR', { maximumFractionDigits: 1 });
    // Oglas kaže da je PDV uključen / bez poreza na promet (postavlja poslužitelj iz teksta oglasa).
    let bezPorezaNaPromet = false;
    const jeBroj = (v) => typeof v === 'number' && Number.isFinite(v);
    // Broj i jedinica (€, €/m², %, m²) nikad se ne lome u dva retka: običan razmak postaje neprelomiv.
    const nb = (t) => (typeof t === 'string' ? t.replace(/(\d) (€\/m²|€|%|m²)/g, '$1\u00A0$2') : t);
    const eur = (v) => (jeBroj(v) ? `${NF.format(v)}\u00A0€` : null);
    const posto = (v) => (jeBroj(v) ? `${NF1.format(v)}\u00A0%` : null);

    function el(tag, cls, tekst) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (tekst !== undefined && tekst !== null) e.textContent = nb(tekst);
      return e;
    }
    // Tri vrste null vrijednosti (null se nikad ne prikazuje kao 0):
    //   'oglas'  — podatak koji oglas ne navodi (površina, cijena, lokacija)
    //   'racun'  — izračun kojem fali ulaz; uz kratki razlog (npr. "nedostaje cijena")
    //   'procjena' — AI procjena koja je null
    function nullTekst(vrsta, razlog) {
      if (vrsta === 'racun') return razlog ? `${NIJE_MOGUCE} — ${razlog}` : NIJE_MOGUCE;
      return vrsta === 'procjena' ? NEMA_PROCJENE : ND;
    }
    function vrijednost(v, cls, vrsta, razlog) {
      const e = el('span', cls);
      if (v === null || v === undefined) { e.className = (cls ? cls + ' ' : '') + 'nd'; e.textContent = nullTekst(vrsta, razlog); }
      else e.textContent = nb(v);
      return e;
    }
    const oznakaUpisali = () => el('span', 'upisali', 'tvoj unos');
    function metrika(label, v, vrsta, razlog, mala, upisao) {
      const m = el('div', 'metrika');
      const lab = el('div', 'metrika-label', label);
      if (upisao) lab.appendChild(oznakaUpisali());
      m.appendChild(lab);
      m.appendChild(vrijednost(v, 'metrika-vrijednost' + (mala ? ' mala' : ''), vrsta, razlog));
      // vrijednost je span; blok radi preko .metrika-vrijednost display
      m.lastChild.style.display = 'block';
      return m;
    }
    function lista(stavke, cls) {
      const ul = el('ul', cls);
      stavke.forEach((t) => ul.appendChild(el('li', null, t)));
      return ul;
    }
    let kartIndeks = 0;
    function kartica(cls, naslov) {
      const k = el('section', 'kartica' + (cls ? ' ' + cls : ''));
      k.style.setProperty('--i', kartIndeks++);
      if (naslov) k.appendChild(el('h2', null, naslov));
      return k;
    }

    const ZNACKE = {
      povoljno: 'Povoljna prilika',
      pregovaraj: 'Za pregovore',
      oprez: 'Oprez',
    };
    const POUZDANOST = { niska: 'Pouzdanost procjene: niska', srednja: 'Pouzdanost procjene: srednja', visoka: 'Pouzdanost procjene: visoka' };
    const RAZINE = { nizak: 'Nizak', srednji: 'Srednji', visok: 'Visok' };

    // Ručni unos cijene: preračun na klijentu istim formulama kao poslužitelj (assets/js/izracuni.js),
    // bez novog AI poziva. Preporuka i ocjena se ne izmišljaju — ostaju "Nedovoljno podataka".
    function preracunajSCijenom(a, tekst, greskaEl, uneseno, referenca) {
      const cijena = PropIQIzracuni.parsirajCijenu(tekst);
      if (cijena === null) {
        greskaEl.textContent = 'Upiši valjanu cijenu u eurima (npr. 185000).';
        return;
      }
      const iz = PropIQIzracuni.izracunaj({ ...a, cijena_eur: cijena });
      analizaEl.replaceChildren(izgradiIzvjestaj(a, iz, cijena, uneseno, referenca));
    }

    // Napomena pod fer vrijednošću: od koje je tržišne reference procjena krenula (podatak dolazi s poslužitelja).
    // DZS traži navođenje izvora, pa su izvori uvijek dio napomene.
    const IZVORI_REFERENCE = 'Izvori: Ministarstvo prostornoga uređenja, graditeljstva i državne imovine (Pregled tržišta nekretnina 2025.); Državni zavod za statistiku.';
    function referencaTekst(r) {
      const x = r && r.realizirana;
      if (!x || !jeBroj(x.uskladeno_eur_m2)) return 'Nema referentnih tržišnih podataka za ovu lokaciju';
      const tromjesecje = `${x.indeks_razdoblje}${x.privremeno ? ' (privremeni podaci)' : ''}`;
      const podrucje = r.ko ? `k.o. ${r.ko} (${r.naziv})` : r.naziv;
      const napomena = r.napomena_kvart ? ` ${r.napomena_kvart}` : '';
      return `Referenca: medijan stvarno plaćenih cijena stanova za ${podrucje} ${x.godina}. (${NF.format(x.broj_prodaja)} prodaja), ` +
        `usklađen DZS indeksom na ${tromjesecje}: ${NF.format(x.uskladeno_eur_m2)} €/m².${napomena} ${IZVORI_REFERENCE}`;
    }
    // Najam nema referentnog izvora po m²: procjena je AI procjena s ograničenom pouzdanošću (postavlja je poslužitelj).
    function najamTekst(najam) {
      const ima = najam && (jeBroj(najam.dugorocni_mj_eur) || jeBroj(najam.turisticki_godisnje_eur));
      if (!ima) return null;
      const pouzdanost = najam.pouzdanost ? ` Pouzdanost procjene najma: ${najam.pouzdanost}.` : '';
      return `Procjena najma je AI procjena bez referentnih tržišnih podataka (nema javno dostupnog izvora najma po m²).${pouzdanost}`;
    }

    function izgradiIzvjestaj(a, iz, rucnaCijena, uneseno, referenca) {
      kartIndeks = 0;
      const frag = document.createDocumentFragment();
      const razlozi = iz.razlozi || {};
      const un = uneseno || {};
      const nemaCijene = !jeBroj(a.cijena_eur);
      const cijena = nemaCijene && jeBroj(rucnaCijena) ? rucnaCijena : a.cijena_eur;
      const rucnaNapomena = () => el('p', 'rucno-napomena', `Na temelju cijene iz tvog unosa (${eur(rucnaCijena)}).`);

      // a) zaglavlje
      const z = kartica('zaglavlje');
      z.appendChild(el('h2', null, a.naslov));
      const lok = [a.lokacija.grad, a.lokacija.kvart].filter(Boolean).join(' · ');
      const lokEl = z.appendChild(vrijednost(lok || null, 'lokacija'));
      lokEl.style.display = 'block';
      if (un.grad || un.kvart) lokEl.appendChild(oznakaUpisali());
      const mz = el('div', 'metrike');
      mz.appendChild(metrika('Površina', jeBroj(a.povrsina_m2) ? `${NF1.format(a.povrsina_m2)} m²` : null, 'oglas', undefined, false, jeBroj(un.povrsina_m2)));
      mz.appendChild(metrika('Tražena cijena', eur(cijena), 'oglas', undefined, false, jeBroj(un.cijena_eur)));
      mz.appendChild(metrika('Cijena po m²', eur(iz.cijena_po_m2) && `${eur(iz.cijena_po_m2)}/m²`, 'racun', razlozi.cijena_po_m2));
      z.appendChild(mz);
      const dodatno = [
        ['kat', 'Kat', (v) => (v === 0 ? 'prizemlje' : String(v))], ['lift', 'Lift', (v) => (v === 'da' ? 'da' : 'ne')],
        ['parking', 'Parking', (v) => v], ['godina_gradnje', 'Godina gradnje', (v) => String(v)],
      ].filter(([k]) => un[k] !== undefined && un[k] !== null);
      if (dodatno.length) {
        const popis = el('div', 'upisali-popis');
        dodatno.forEach(([k, naziv, f]) => {
          const stavka = el('span', null, `${naziv}: ${f(un[k])}`);
          stavka.appendChild(oznakaUpisali());
          popis.appendChild(stavka);
        });
        z.appendChild(popis);
      }
      if (nemaCijene) {
        const unos = el('div', 'cijena-unos');
        const oznaka = el('label', null, 'Upiši traženu cijenu (€)');
        oznaka.htmlFor = 'rucna-cijena';
        unos.appendChild(oznaka);
        const unosRed = el('div', 'cijena-unos-red');
        const polje = el('input');
        polje.id = 'rucna-cijena';
        polje.type = 'text';
        polje.inputMode = 'numeric';
        polje.maxLength = 15;
        polje.placeholder = 'npr. 185000';
        if (jeBroj(rucnaCijena)) polje.value = String(rucnaCijena);
        const gumb = el('button', null, 'Preračunaj');
        gumb.type = 'button';
        const greska = el('div', 'cijena-greska');
        const pokreni = () => preracunajSCijenom(a, polje.value, greska, uneseno, referenca);
        gumb.addEventListener('click', pokreni);
        polje.addEventListener('keydown', (e) => { if (e.key === 'Enter') pokreni(); });
        unosRed.appendChild(polje);
        unosRed.appendChild(gumb);
        unos.appendChild(unosRed);
        unos.appendChild(greska);
        z.appendChild(unos);
        if (jeBroj(rucnaCijena)) z.appendChild(rucnaNapomena());
      }
      frag.appendChild(z);

      // b) preporuka
      const p = kartica('preporuka');
      const red = el('div', 'preporuka-red');
      if (a.preporuka === null || a.ocjena === null) {
        // Bez tražene cijene nema investicijske ocjene ni preporuke.
        red.appendChild(el('span', 'znacka nedovoljno', 'Nedovoljno podataka'));
        p.appendChild(red);
        p.appendChild(el('p', 'nedovoljno-tekst', jeBroj(rucnaCijena)
          ? 'Brojke ispod preračunate su na temelju cijene iz tvog unosa, ali ocjena i preporuka nisu izdane. Za njih ponovno pokreni analizu s cijenom u oglasu.'
          : 'Oglas ne navodi traženu cijenu, a bez nje nema investicijske ocjene ni preporuke (povoljno / pregovaraj / oprez). Upiši cijenu u zaglavlju za preračun brojki ili ponovno pokreni analizu s cijenom.'));
      } else {
        red.appendChild(el('span', 'znacka ' + a.preporuka, ZNACKE[a.preporuka]));
        const oc = el('div', 'ocjena', String(a.ocjena));
        oc.appendChild(el('small', null, ' / 10'));
        red.appendChild(oc);
        p.appendChild(red);
      }
      p.appendChild(el('p', 'sazetak', a.sazetak));
      frag.appendChild(p);

      // c) fer vrijednost
      const f = kartica('fer', 'Fer vrijednost');
      const fv = a.fer_vrijednost;
      const raspon = jeBroj(fv.min_eur) && jeBroj(fv.max_eur) ? `${eur(fv.min_eur)} – ${eur(fv.max_eur)}` : null;
      f.appendChild(vrijednost(raspon, 'raspon', 'procjena')).style.display = 'block';
      const poM2 = jeBroj(iz.fer_po_m2.min) && jeBroj(iz.fer_po_m2.max)
        ? `${eur(iz.fer_po_m2.min)} – ${eur(iz.fer_po_m2.max)} po m²` : null;
      if (poM2) f.appendChild(el('div', 'raspon-po-m2', poM2));
      else if (raspon) f.appendChild(vrijednost(null, 'raspon-po-m2', 'racun', razlozi.fer_po_m2));
      if (iz.traka) {
        const t = iz.traka;
        const traka = el('div', 'traka');
        const ferDio = el('div', 'traka-fer');
        ferDio.style.left = t.fer_od_posto + '%';
        ferDio.style.width = Math.max(t.fer_do_posto - t.fer_od_posto, 1) + '%';
        traka.appendChild(ferDio);
        const marker = el('div', 'traka-cijena');
        marker.style.left = t.cijena_posto + '%';
        traka.appendChild(marker);
        const oznaka = el('div', 'traka-oznaka', `Tražena: ${eur(cijena)}`);
        oznaka.style.left = Math.min(85, Math.max(15, t.cijena_posto)) + '%';
        traka.appendChild(oznaka);
        const krajevi = el('div', 'traka-krajevi');
        krajevi.appendChild(el('span', null, eur(t.od_eur)));
        krajevi.appendChild(el('span', null, eur(t.do_eur)));
        traka.appendChild(krajevi);
        f.appendChild(traka);
        const tekstPolozaja = {
          ispod: 'Tražena cijena je ispod procijenjenog fer raspona.',
          unutar: 'Tražena cijena je unutar procijenjenog fer raspona.',
          iznad: 'Tražena cijena je iznad procijenjenog fer raspona.',
        }[t.polozaj];
        f.appendChild(el('p', 'polozaj', tekstPolozaja));
        if (nemaCijene && jeBroj(rucnaCijena)) f.appendChild(rucnaNapomena());
      } else {
        const polozaj = el('p', 'polozaj');
        polozaj.appendChild(document.createTextNode('Pozicija tražene cijene na traci fer vrijednosti: '));
        polozaj.appendChild(vrijednost(null, null, 'racun', razlozi.traka));
        f.appendChild(polozaj);
      }
      f.appendChild(el('span', 'chip ' + fv.pouzdanost, POUZDANOST[fv.pouzdanost]));
      // Obrazloženje se slaže iz istog popisa korekcija i izračunatih brojeva (polazište → korekcije → zbroj → raspon).
      f.appendChild(el('p', null, fv.izracun ? PropIQIzracuni.obrazlozenjeFer(fv.izracun) : fv.obrazlozenje));
      if (fv.bez_reference) f.appendChild(el('p', 'referenca-napomena', 'Za ovu lokaciju nema referentnog medijana: raspon je izravna procjena modela, bez izračuna iz korekcija, pa je manje provjerljiv.'));
      f.appendChild(el('p', 'referenca-napomena', referencaTekst(referenca)));
      frag.appendChild(f);

      // d) prinos
      const pr = kartica('prinos', 'Prinos od najma');
      const mp = el('div', 'metrike cetiri');
      mp.appendChild(metrika('Bruto prinos', posto(iz.bruto_prinos), 'racun', razlozi.bruto_prinos));
      mp.appendChild(metrika('Neto prinos', posto(iz.neto_prinos), 'racun', razlozi.neto_prinos));
      mp.appendChild(metrika('Dugoročni najam', eur(a.najam.dugorocni_mj_eur) && `${eur(a.najam.dugorocni_mj_eur)} / mj.`, 'procjena'));
      mp.appendChild(metrika('Godine povrata', jeBroj(iz.godine_povrata) ? `${NF1.format(iz.godine_povrata)} god.` : null, 'racun', razlozi.godine_povrata));
      pr.appendChild(mp);
      if (nemaCijene && jeBroj(rucnaCijena)) pr.appendChild(rucnaNapomena());
      if (jeBroj(a.najam.turisticki_godisnje_eur)) {
        const tur = `Turistički najam: procjena ${eur(a.najam.turisticki_godisnje_eur)} godišnje` +
          (jeBroj(iz.bruto_prinos_turisticki) ? ` (bruto prinos ${posto(iz.bruto_prinos_turisticki)}).` : '.');
        pr.appendChild(el('p', null, tur));
      }
      pr.appendChild(lista(iz.pretpostavke, 'napomene'));
      const najamNapomena = najamTekst(a.najam);
      if (najamNapomena) pr.appendChild(el('p', 'referenca-napomena', najamNapomena));
      frag.appendChild(pr);

      // e) rizici + porez na promet
      const r = kartica('rizici', 'Rizici');
      if (a.rizici.length) {
        a.rizici.forEach((rz) => {
          const d = el('div', 'rizik');
          const g = el('div', 'rizik-glava');
          g.appendChild(el('span', 'rizik-naslov', rz.naslov));
          g.appendChild(el('span', 'razina ' + rz.razina, RAZINE[rz.razina]));
          d.appendChild(g);
          d.appendChild(el('p', null, rz.opis));
          r.appendChild(d);
        });
      } else {
        r.appendChild(el('p', null, 'Iz oglasa nisu uočeni posebni rizici.'));
      }
      const poreznaRed = el('div', 'porez');
      if (bezPorezaNaPromet) {
        poreznaRed.appendChild(el('span', null, 'Porez na promet nekretnina'));
        poreznaRed.appendChild(el('strong', null, 'ne plaća se (PDV je uključen u cijenu)'));
      } else {
        poreznaRed.appendChild(el('span', null, 'Porez na promet nekretnina (3 %)'));
        const ps = el('strong');
        ps.appendChild(vrijednost(eur(iz.porez_na_promet), null, 'racun', razlozi.porez_na_promet));
        poreznaRed.appendChild(ps);
      }
      r.appendChild(poreznaRed);
      if (nemaCijene && jeBroj(rucnaCijena)) r.appendChild(rucnaNapomena());
      frag.appendChild(r);

      // f) pregovaranje
      const n = kartica('pregovaranje', 'Strategija pregovaranja');
      const pn = a.pregovaranje;
      n.appendChild(el('div', 'metrika-label', 'Ciljana ponuda'));
      const pRed = el('div', 'ponuda-red');
      pRed.appendChild(vrijednost(jeBroj(iz.ciljana_ponuda_eur) ? eur(iz.ciljana_ponuda_eur) : null, 'ponuda', 'procjena', razlozi.usteda));
      if (jeBroj(iz.usteda_eur)) {
        pRed.appendChild(el('span', 'usteda', `ušteda ${eur(iz.usteda_eur)} (${posto(iz.usteda_posto)})`));
      } else if (iz.ciljana_ponuda_napomena) {
        pRed.appendChild(el('span', 'usteda', iz.ciljana_ponuda_napomena));
      }
      n.appendChild(pRed);
      if (nemaCijene && jeBroj(rucnaCijena) && jeBroj(iz.ciljana_ponuda_eur)) n.appendChild(rucnaNapomena());
      if (pn.aduti.length) { n.appendChild(el('h3', null, 'Tvoji aduti')); n.appendChild(lista(pn.aduti)); }
      if (pn.pitanja_prodavatelju.length) { n.appendChild(el('h3', null, 'Pitanja za prodavatelja')); n.appendChild(lista(pn.pitanja_prodavatelju)); }
      frag.appendChild(n);

      // g) što oglas ne navodi
      const nd = kartica('nedostaje', 'Što oglas ne navodi');
      if (a.nedostajuci_podaci.length) nd.appendChild(lista(a.nedostajuci_podaci));
      else nd.appendChild(el('p', null, 'Oglas navodi sve ključne podatke.'));
      frag.appendChild(nd);

      // h) footer
      const ft = el('p', 'footer-napomena', 'Analiza je informativna procjena i nije investicijski savjet.');
      ft.style.animation = `fadeUp 0.8s var(--ease) both`;
      ft.style.animationDelay = `${kartIndeks * 0.09}s`;
      frag.appendChild(ft);
      return frag;
    }

    function prikaziAnalizu(rezultat) {
      bezPorezaNaPromet = rezultat.bez_poreza_na_promet === true;
      analizaEl.replaceChildren(izgradiIzvjestaj(rezultat.analiza, rezultat.izracuni, undefined, rezultat.uneseno, rezultat.referenca));
      hide(loadingEl);
      hide(errorEl);
      reveal(analizaEl);

      // Prikaži akcije (Spremi kao PDF / Nova analiza) tek kad analiza postoji
      document.getElementById('analiza-actions').style.display = 'flex';
      // Pripremi print zaglavlje: naslov analize + trenutni datum (hrvatski format)
      document.getElementById('print-title').textContent = document.getElementById('greeting').textContent;
      document.getElementById('print-date').textContent =
        new Date().toLocaleDateString('hr-HR', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    const GRESKA_VEZE = 'Došlo je do greške pri dohvaćanju analize. Provjeri vezu i pokušaj ponovo.';
    // Poruka za neuspjeli korak A/B. Poslužiteljeva poruka ima prednost; bez nje se razlikuje stvarni prekid veze
    // (status 0), pogreška poslužitelja/pristupnika (5xx, često HTML bez JSON-a) i nepotpun odgovor — da se
    // npr. 504 ne prikaže kao "veza je prekinuta".
    function porukaGreskeKoraka(ishod) {
      const p = (ishod && ishod.payload) || {};
      if (p.error) return p.error;
      if (!ishod || !ishod.status) return GRESKA_VEZE;
      if (ishod.ok) return 'Odgovor poslužitelja nije potpun. Pokušaj ponovo — ova analiza se ne broji u limit.';
      if (ishod.status >= 500) return `Poslužitelj nije stigao dovršiti analizu (HTTP ${ishod.status}). Pokušaj ponovo — ova analiza se ne broji u limit.`;
      return `Zahtjev za analizu nije prihvaćen (HTTP ${ishod.status}). Pokušaj ponovo s početne stranice.`;
    }
    const jeRezultat = (r) => !!r && typeof r === 'object' && !!r.analiza && typeof r.analiza === 'object' &&
      !!r.izracuni && typeof r.izracuni === 'object';

    function procitajSpremljeniRezultat(requestId) {
      if (!requestId) return null;
      try {
        const spremljeno = JSON.parse(sessionStorage.getItem('propiq_analiza_rezultat') || 'null');
        return spremljeno && spremljeno.request_id === requestId && jeRezultat(spremljeno.analiza) ? spremljeno.analiza : null;
      } catch {
        return null;
      }
    }

    async function loadAnaliza() {
      let raw;
      try {
        raw = sessionStorage.getItem('propiq_analiza_data');
      } catch {
        raw = null;
      }

      if (!raw) {
        showError('Nema podataka za analizu. Vrati se na početnu i ispuni formu.');
        return;
      }

      let data;
      try {
        data = JSON.parse(raw);
      } catch {
        showError('Podaci za analizu su neispravni. Pokušaj ponovo s početne stranice.');
        return;
      }

      // Personalizirani pozdrav ako imamo ime
      if (data.ime) {
        const first = String(data.ime).trim().split(/\s+/)[0];
        if (first) document.getElementById('greeting').textContent = `Analiza za ${first}`;
      }

      // F5 nakon gotove analize: prikaži spremljeni rezultat bez novog poziva funkcije
      // (i bez ponovnog mjerenja konverzije).
      const spremljenaAnaliza = procitajSpremljeniRezultat(data.request_id);
      if (spremljenaAnaliza) {
        prikaziAnalizu(spremljenaAnaliza);
        return;
      }

      try {
        // Zahtjev A: slijepa procjena. Poslužitelj je sprema i vraća ID.
        loadingTekstEl.textContent = FAZE.procjena;
        const a = await izvrsiKorak({ ...data, korak: 'procjena' });
        if (!a.ok || !a.payload.procjena_id) {
          console.error('Korak A nije uspio:', a.status, Object.keys(a.payload));
          showError(porukaGreskeKoraka(a), a.status === 403);
          return;
        }

        // Zahtjev B: analiza na temelju spremljene procjene. Limit se troši tek kad B uspije.
        loadingTekstEl.textContent = FAZE.analiza;
        const b = await izvrsiKorak({ ...data, korak: 'analiza', procjena_id: a.payload.procjena_id });
        const analiza = b.payload.rezultat;
        if (!b.ok || !jeRezultat(analiza)) {
          console.error('Korak B nije uspio:', b.status, Object.keys(b.payload));
          showError(porukaGreskeKoraka(b), b.status === 403);
          return;
        }

        try {
          prikaziAnalizu(analiza);
        } catch (err) {
          console.error('Prikaz izvještaja nije uspio:', err);
          showError('Izvještaj se nije mogao prikazati. Pokušaj ponovo.');
          return;
        }

        // Spremi gotov rezultat da F5 prikaže istu analizu bez novog poziva.
        if (data.request_id) {
          try {
            sessionStorage.setItem('propiq_analiza_rezultat',
              JSON.stringify({ request_id: data.request_id, analiza }));
          } catch {}
        }

        // Glavna konverzija. Broji se jednom: refresh prikazuje spremljeni rezultat
        // i ovdje ne dolazi.
        try {
          window.propiqTrack && window.propiqTrack('analysis_success', {
            plan: data.plan || 'free',
            event_id: 'an_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
          });
        } catch {}
      } catch {
        showError(GRESKA_VEZE);
      }
    }

    loadAnaliza();
  </script>

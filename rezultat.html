<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vaša analiza — PropIQ</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    :root {
      --bg: #0a0806;
      --cream: #f0ece4;
      --cream-70: rgba(240,236,228,0.7);
      --cream-40: rgba(240,236,228,0.4);
      --cream-15: rgba(240,236,228,0.15);
      --cream-08: rgba(240,236,228,0.08);
      --cream-04: rgba(240,236,228,0.04);
      --gold: #d4af37;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--cream);
      min-height: 100vh;
      line-height: 1.6;
    }

    .wrap {
      max-width: 780px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ─── Header ─── */
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 40px;
      animation: fadeUp 0.8s var(--ease) both;
    }
    .logo {
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
    }
    .logo span { color: var(--gold); }
    .back-link {
      color: var(--cream-70);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      transition: color 0.35s var(--ease);
    }
    .back-link:hover { color: var(--cream); }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 100px;
      background: rgba(240,236,228,0.06);
      border: 1px solid var(--cream-15);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--cream-70);
      margin-bottom: 18px;
      animation: fadeUp 0.8s var(--ease) both;
      animation-delay: 0.08s;
    }
    .eyebrow-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--gold); box-shadow: 0 0 10px var(--gold);
      animation: dotPulse 2.2s var(--ease) infinite;
    }
    @keyframes dotPulse {
      0%, 100% { opacity: 0.6; box-shadow: 0 0 6px var(--gold); }
      50% { opacity: 1; box-shadow: 0 0 14px var(--gold); }
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      animation: fadeUp 0.8s var(--ease) both;
      animation-delay: 0.16s;
    }
    .subtitle {
      color: var(--cream-70);
      font-size: 0.95rem;
      margin-bottom: 36px;
      animation: fadeUp 0.8s var(--ease) both;
      animation-delay: 0.24s;
    }

    /* ─── Loading ─── */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      padding: 80px 0;
      text-align: center;
      animation: fadeUp 0.8s var(--ease) both;
      animation-delay: 0.32s;
    }
    .spinner-wrap { position: relative; width: 56px; height: 56px; }
    .spinner-pulse {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(212,175,55,0.28), transparent 70%);
      animation: pulse 1.8s var(--ease) infinite;
    }
    .spinner {
      position: absolute;
      top: 8px; left: 8px;
      width: 40px; height: 40px;
      border: 3px solid var(--cream-15);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse {
      0%, 100% { transform: scale(0.82); opacity: 0.35; }
      50%      { transform: scale(1.18); opacity: 0.85; }
    }
    .loading p {
      color: var(--cream-70);
      font-size: 0.95rem;
      animation: breathe 2.4s var(--ease) infinite;
    }
    @keyframes breathe { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }

    /* ─── Analiza card ─── */
    .analiza-card {
      position: relative;
      overflow: hidden;
      background: var(--cream-04);
      border: 1px solid var(--cream-08);
      border-radius: 20px;
      padding: 36px 32px;
      --mx: 50%;
      --my: 0%;
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.7s var(--ease), transform 0.7s var(--ease), border-color 0.4s var(--ease);
    }
    .analiza-card.show { opacity: 1; transform: translateY(0); }
    .analiza-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(480px circle at var(--mx) var(--my), rgba(212,175,55,0.07), transparent 60%);
      opacity: 0;
      transition: opacity 0.5s var(--ease);
      pointer-events: none;
    }
    .analiza-card:hover::before { opacity: 1; }
    .analiza-card:hover { border-color: var(--cream-15); }
    .analiza-card h1, .analiza-card h2, .analiza-card h3 {
      color: var(--cream);
      margin: 26px 0 12px;
      line-height: 1.3;
    }
    .analiza-card h1 { font-size: 1.5rem; }
    .analiza-card h2 { font-size: 1.25rem; }
    .analiza-card h3 { font-size: 1.05rem; }
    .analiza-card h1:first-child, .analiza-card h2:first-child, .analiza-card h3:first-child { margin-top: 0; }
    .analiza-card p { margin: 12px 0; color: var(--cream-70); }
    .analiza-card ul, .analiza-card ol { margin: 12px 0 12px 22px; color: var(--cream-70); }
    .analiza-card li { margin: 6px 0; }
    .analiza-card strong { color: var(--cream); font-weight: 700; }
    .analiza-card hr { border: none; border-top: 1px solid var(--cream-08); margin: 24px 0; }
    .analiza-card table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 0.9rem; }
    .analiza-card th, .analiza-card td { border: 1px solid var(--cream-15); padding: 8px 12px; text-align: left; }
    .analiza-card th { background: var(--cream-08); color: var(--cream); }

    /* ─── Greška ─── */
    .error-box {
      background: rgba(220, 80, 60, 0.06);
      border: 1px solid rgba(220, 80, 60, 0.28);
      border-radius: 20px;
      padding: 40px 32px;
      text-align: center;
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.7s var(--ease), transform 0.7s var(--ease), border-color 0.4s var(--ease), background 0.4s var(--ease);
    }
    .error-box.show { opacity: 1; transform: translateY(0); }
    .error-box.upgrade {
      background: rgba(212, 175, 55, 0.05);
      border-color: rgba(212, 175, 55, 0.28);
    }
    .error-icon {
      width: 48px; height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      color: #e0705a;
      background: rgba(220, 80, 60, 0.12);
      box-shadow: 0 0 26px rgba(220, 80, 60, 0.16);
      transition: color 0.4s var(--ease), background 0.4s var(--ease), box-shadow 0.4s var(--ease);
    }
    .error-box.upgrade .error-icon {
      color: var(--gold);
      background: rgba(212, 175, 55, 0.12);
      box-shadow: 0 0 26px rgba(212, 175, 55, 0.2);
    }
    .error-box p { color: var(--cream); margin-bottom: 26px; font-size: 0.98rem; }
    .error-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-primary {
      background: var(--cream);
      color: var(--bg);
      border: none;
      padding: 14px 32px;
      border-radius: 100px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      text-decoration: none;
      display: inline-block;
      transition: opacity 0.35s var(--ease), transform 0.35s var(--ease), box-shadow 0.35s var(--ease);
    }
    .btn-primary:hover {
      opacity: 0.92;
      transform: translateY(-3px);
      box-shadow: 0 14px 32px rgba(212,175,55,0.16);
    }

    .btn-ghost {
      background: transparent;
      color: var(--cream-70);
      border: 1px solid var(--cream-15);
      padding: 14px 28px;
      border-radius: 100px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      text-decoration: none;
      display: inline-block;
      transition: border-color 0.35s var(--ease), color 0.35s var(--ease), transform 0.35s var(--ease);
    }
    .btn-ghost:hover {
      border-color: var(--cream-40);
      color: var(--cream);
      transform: translateY(-3px);
    }

    /* ═══════════════════════════════════════════════════════════
       UPSELL PLACEHOLDER — prostor za budući Pro plan CTA.
       Za sad prazno; ovdje ide upsell na Pro (usporedba nekretnina,
       PDF izvještaj, povijest analiza, itd.).
       ═══════════════════════════════════════════════════════════ */
    #upsell-pro {
      /* namjerno prazno — popuniti kasnije */
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (max-width: 600px) {
      .wrap { padding: 32px 18px 60px; }
      h1 { font-size: 1.6rem; }
      .analiza-card { padding: 26px 20px; }
      .error-box { padding: 32px 22px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="logo">Prop<span>IQ</span></div>
      <a href="index.html" class="back-link">← Natrag na početnu</a>
    </div>

    <div class="eyebrow"><span class="eyebrow-dot"></span>AI analiza nekretnine</div>
    <h1 id="greeting">Vaša analiza</h1>
    <p class="subtitle">Generirano na temelju oglasa koji ste poslali.</p>

    <!-- Loading -->
    <div class="loading" id="loading">
      <div class="spinner-wrap">
        <div class="spinner-pulse"></div>
        <div class="spinner"></div>
      </div>
      <p>Analiziramo nekretninu… ovo traje nekoliko sekundi.</p>
    </div>

    <!-- Rezultat -->
    <div class="analiza-card" id="analiza" style="display:none;"></div>

    <!-- Greška -->
    <div class="error-box" id="error" style="display:none;">
      <div class="error-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
      </div>
      <p id="error-msg">Došlo je do greške pri dohvaćanju analize.</p>
      <div class="error-actions">
        <a href="index.html#cijene" class="btn-primary" id="error-upgrade-btn" style="display:none;">Pogledaj planove</a>
        <button class="btn-ghost" id="error-retry-btn" onclick="location.reload()">Pokušaj ponovo</button>
      </div>
    </div>

    <!-- UPSELL PLACEHOLDER (Pro plan) — za sad prazno, popuniti kasnije -->
    <section id="upsell-pro"></section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    marked.use({ breaks: true, gfm: true });

    const loadingEl = document.getElementById('loading');
    const analizaEl = document.getElementById('analiza');
    const errorEl = document.getElementById('error');
    const errorMsgEl = document.getElementById('error-msg');
    const errorUpgradeBtn = document.getElementById('error-upgrade-btn');

    // Glatko prikazivanje elementa: postavi display, pa na sljedećem
    // frameu dodaj klasu koja pokreće CSS tranziciju (fade + slide up).
    function reveal(el) {
      el.style.display = 'block';
      requestAnimationFrame(() => {
        requestAnimationFrame(() => el.classList.add('show'));
      });
    }
    function hide(el) {
      el.classList.remove('show');
      el.style.display = 'none';
    }

    function showError(msg, isQuota) {
      hide(loadingEl);
      hide(analizaEl);
      if (msg) errorMsgEl.textContent = msg;
      errorEl.classList.toggle('upgrade', !!isQuota);
      errorUpgradeBtn.style.display = isQuota ? 'inline-block' : 'none';
      reveal(errorEl);
    }

    // Suptilan "spotlight" koji prati miša preko kartice s analizom —
    // ista ideja kao na glavnoj stranici, samo suzdržanije.
    analizaEl.addEventListener('mousemove', (e) => {
      const rect = analizaEl.getBoundingClientRect();
      analizaEl.style.setProperty('--mx', `${e.clientX - rect.left}px`);
      analizaEl.style.setProperty('--my', `${e.clientY - rect.top}px`);
    });

    async function loadAnaliza() {
      let raw;
      try {
        raw = sessionStorage.getItem('propiq_analiza_data');
      } catch {
        raw = null;
      }

      if (!raw) {
        showError('Nema podataka za analizu. Vratite se na početnu i ispunite formu.');
        return;
      }

      let data;
      try {
        data = JSON.parse(raw);
      } catch {
        showError('Podaci za analizu su neispravni. Pokušajte ponovo s početne stranice.');
        return;
      }

      // Personalizirani pozdrav ako imamo ime
      if (data.ime) {
        const first = String(data.ime).trim().split(/\s+/)[0];
        if (first) document.getElementById('greeting').textContent = `Analiza za ${first}`;
      }

      try {
        const res = await fetch('/.netlify/functions/analiza', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });

        const payload = await res.json().catch(() => ({}));

        if (!res.ok) {
          showError(payload.error || 'Analiza trenutno nije dostupna. Pokušajte ponovo.', res.status === 403);
          return;
        }

        if (!payload.analiza) {
          showError('Analiza je vraćena prazna. Pokušajte ponovo.');
          return;
        }

        analizaEl.innerHTML = marked.parse(payload.analiza);
        hide(loadingEl);
        hide(errorEl);
        reveal(analizaEl);

        // Podaci više nisu potrebni — očisti da se ista analiza ne ponavlja na refresh.
        try { sessionStorage.removeItem('propiq_analiza_data'); } catch {}
      } catch {
        showError('Došlo je do greške pri dohvaćanju analize. Provjerite vezu i pokušajte ponovo.');
      }
    }

    loadAnaliza();
  </script>
</body>
</html>
